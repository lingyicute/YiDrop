name: Build Android APK and nightly

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      debug_signing:
        description: '仅测试：使用 debug 签名（不可作为正式更新发布）'
        type: boolean
        default: false
  workflow_call:
    inputs:
      debug_signing:
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"
  # Branch pushes intentionally keep the 2025 test-signing behavior.
  YIDROP_DEBUG_SIGNING: ${{ (github.event_name == 'push' || inputs.debug_signing) && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Decode key.properties file
        if: ${{ github.event_name != 'push' && !inputs.debug_signing }}
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo $ENCODED_STRING | base64 -di > app/android/key.properties

      - name: Decode android-keystore.jks file
        if: ${{ github.event_name != 'push' && !inputs.debug_signing }}
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir secrets && echo $ENCODED_STRING | base64 -di > secrets/android-keystore.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Check rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/yidrop_isolates
        run: rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Regenerate Chinese translations
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: dart run slang

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-result
          if-no-files-found: error
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  publish_nightly:
    # Reusable formal release builds must not mutate nightly tags.
    if: ${{ github.event_name == 'push' }}
    needs: build_apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Builds are NOT cancelled. Serialize publishing per branch; an old run
    # checks the remote branch head and cannot roll a newer nightly backwards.
    concurrency:
      group: yidrop-nightly-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download the APKs from this run
        uses: actions/download-artifact@v4
        with:
          name: apk-result
          path: nightly-artifacts
      - name: Publish branch nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YIDROP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 support/scripts/publish_nightly.py nightly-artifacts
